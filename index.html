<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>J. Robert Oppenheimer – Danny, Paul, Leon</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; background: #000; color: #f5f2ec; font-family: Arial, sans-serif; overflow: hidden; }
  #stage { position: fixed; inset: 0; display: grid; place-items: center; cursor: pointer; }
  #stage img { position: absolute; max-width: 100vw; max-height: 100vh; width: auto; height: auto;
    aspect-ratio: 16 / 9; opacity: 0; transition: opacity 0.9s ease; }
  #stage img.on { opacity: 1; }
  #bar { position: fixed; left: 0; right: 0; bottom: 0; display: flex; gap: 10px; align-items: center;
    padding: 10px 16px; background: linear-gradient(transparent, rgba(0,0,0,0.85));
    opacity: 0; transition: opacity 0.3s; font-size: 14px; }
  body:hover #bar, #bar:focus-within { opacity: 1; }
  #bar button, #bar a { background: #1a1e28; color: #f5f2ec; border: 1px solid #2a2f3a; border-radius: 6px;
    padding: 7px 12px; font: inherit; text-decoration: none; cursor: pointer; }
  #bar a.hot { border-color: #ff7a28; color: #ffb547; }
  #count { margin-right: auto; color: #aeb4bf; }
  #start { position: fixed; inset: 0; display: grid; place-items: center; background: #07080c; z-index: 2;
    text-align: center; cursor: pointer; transition: opacity 0.8s; }
  #start h1 { font-family: "Arial Black", Arial, sans-serif; font-size: clamp(32px, 6vw, 80px); letter-spacing: -1px; }
  #start p { color: #ffb547; font-family: Georgia, serif; font-style: italic; font-size: clamp(16px, 2vw, 24px); margin-top: 12px; }
  #start small { display: block; color: #6b7280; margin-top: 40px; font-size: 14px; letter-spacing: 2px; }
</style>
</head>
<body>
<div id="start">
  <div>
    <h1>OPPENHEIMER</h1>
    <p>Klicken zum Starten</p>
    <small>→ / Leertaste: weiter  ·  ←: zurück  ·  F: Vollbild</small>
  </div>
</div>
<div id="stage"></div>
<div id="bar">
  <span id="count"></span>
  <button id="prev">←</button>
  <button id="next">→</button>
  <button id="full">Vollbild</button>
  <a id="online" class="hot" target="_blank" rel="noopener">Mit Übergängen ansehen</a>
  <a href="Oppenheimer.pptx" download>PPTX herunterladen</a>
</div>
<script>
  const TOTAL = 17;
  const stage = document.getElementById("stage");
  const imgs = [];
  for (let i = 1; i <= TOTAL; i++) {
    const img = new Image();
    img.src = `slides/${String(i).padStart(2, "0")}.jpg`;
    img.alt = `Folie ${i}`;
    stage.appendChild(img);
    imgs.push(img);
  }
  let cur = 0;
  function show(n) {
    cur = Math.max(0, Math.min(TOTAL - 1, n));
    imgs.forEach((im, i) => im.classList.toggle("on", i === cur));
    document.getElementById("count").textContent = `${cur + 1} / ${TOTAL}`;
  }
  const start = document.getElementById("start");
  function begin() { start.style.opacity = 0; setTimeout(() => start.remove(), 800); show(0); }
  start.addEventListener("click", begin);
  stage.addEventListener("click", () => show(cur + 1));
  document.getElementById("prev").onclick = () => show(cur - 1);
  document.getElementById("next").onclick = () => show(cur + 1);
  const full = () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
  document.getElementById("full").onclick = full;
  document.addEventListener("keydown", e => {
    if (document.getElementById("start")) { if (["ArrowRight", " ", "Enter", "PageDown"].includes(e.key)) begin(); return; }
    if (["ArrowRight", " ", "PageDown", "Enter"].includes(e.key)) show(cur + 1);
    else if (["ArrowLeft", "PageUp", "Backspace"].includes(e.key)) show(cur - 1);
    else if (e.key === "Home") show(0);
    else if (e.key === "End") show(TOTAL - 1);
    else if (e.key.toLowerCase() === "f") full();
  });
  const pptx = new URL("Oppenheimer.pptx", location.href).href;
  document.getElementById("online").href =
    "https://view.officeapps.live.com/op/view.aspx?src=" + encodeURIComponent(pptx);
</script>
</body>
</html>
